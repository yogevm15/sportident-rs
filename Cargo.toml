[package]
name = "sportident"
version = "0.0.9"
edition = "2021"
description = "Interact with Sportident in rust with ease."
license = "Apache-2.0"
repository = "https://github.com/yogevm15/sportident-rs"
readme = "README.md"
keywords = ["sportident", "orienteering"]
categories = ["hardware-support"]
include = ["/src", "LICENSE", "/examples", "README.md"]

[dependencies]
bitflags = "2"
chrono = "0.4"
futures = "0.3"
serialport = "4"
strum_macros = "0.27"
thiserror = "2"
tokio-serial = "5"
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
hex = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
